services:
    api:
        image: vention-api
        restart: always
        env_file:
            - .env.production.local
        ports:
            - '3000:3000'
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
            clamav:
                condition: service_healthy
            vector-db:
                condition: service_healthy
        networks:
            - backend
        healthcheck:
            test:
                [
                    'CMD',
                    'wget',
                    '--spider',
                    '-q',
                    'http://localhost:3000/api/health',
                ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 30s
        deploy:
            resources:
                limits:
                    cpus: '1.00'
                    memory: 768M
                reservations:
                    cpus: '0.25'
                    memory: 384M

    db:
        image: postgres:17
        container_name: postgres_db
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: app_db
        command:
            - postgres
            - -c
            - shared_buffers=128MB
            - -c
            - effective_cache_size=384MB
            - -c
            - work_mem=16MB
            - -c
            - maintenance_work_mem=64MB
            - -c
            - max_connections=100
            - -c
            - wal_buffers=16MB
            - -c
            - random_page_cost=1.1
        ports:
            - '5432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - backend
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d app_db']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        deploy:
            resources:
                limits:
                    cpus: '1.00'
                    memory: 768M
                reservations:
                    cpus: '0.25'
                    memory: 384M
    vector-db:
        image: qdrant/qdrant:latest
        container_name: qdrant-vector-db
        restart: always

        environment:
            QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

        volumes:
            - qdrant-data:/qdrant/storage

        networks:
            - backend

        healthcheck:
            test:
                ['CMD-SHELL', 'curl -f http://localhost:6333/healthz || exit 1']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

        deploy:
            resources:
                limits:
                    cpus: '1.00'
                    memory: 1G
                reservations:
                    cpus: '0.25'
                    memory: 256M

    pgadmin:
        image: dpage/pgadmin4
        restart: always
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@example.com
            PGADMIN_DEFAULT_PASSWORD: admin
        ports:
            - '8888:80'
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - pgadmin-data:/var/lib/pgadmin
        networks:
            - backend
        deploy:
            resources:
                limits:
                    cpus: '0.50'
                    memory: 384M
                reservations:
                    cpus: '0.10'
                    memory: 128M

    redis:
        image: redis:7
        restart: always
        ports:
            - '6379:6379'
        volumes:
            - redis-data:/data
        networks:
            - backend
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    cpus: '0.50'
                    memory: 256M
                reservations:
                    cpus: '0.10'
                    memory: 64M

    rabbitmq:
        image: rabbitmq:4-management
        restart: always
        ports:
            - '5672:5672'
            - '15672:15672'
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        networks:
            - backend
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', 'check_running']
            interval: 15s
            timeout: 10s
            retries: 5
        deploy:
            resources:
                limits:
                    cpus: '0.75'
                    memory: 512M
                reservations:
                    cpus: '0.20'
                    memory: 256M

    clamav:
        image: clamav/clamav:stable
        restart: always
        environment:
            CLAMD_CONF_ConcurrentDatabaseReload: 'no'
        ports:
            - '3310:3310'
        volumes:
            - clamav-data:/var/lib/clamav
        networks:
            - backend
        healthcheck:
            test: ['CMD-SHELL', 'clamdscan --ping || exit 1']
            interval: 60s
            timeout: 15s
            retries: 10
            start_period: 240s
        deploy:
            resources:
                limits:
                    cpus: '1.00'
                    memory: 2G
                reservations:
                    cpus: '0.25'
                    memory: 1536M

    file-worker:
        build:
            context: .
            dockerfile: microservices/file-worker/dockerfile
        image: vention-file-worker
        restart: always
        env_file:
            - .env.production.local
        environment:
            NODE_ENV: production
            RABBITMQ_HOST: rabbitmq
            FIREBASE_SERVICE_ACCOUNT_PATH: ./credentials/firebase-service-account.json
        volumes:
            - ./microservices/file-worker/credentials:/app/credentials:ro
        depends_on:
            rabbitmq:
                condition: service_healthy
            api:
                condition: service_healthy
        networks:
            - backend
        deploy:
            resources:
                limits:
                    cpus: '0.75'
                    memory: 512M
                reservations:
                    cpus: '0.20'
                    memory: 256M

volumes:
    postgres-data:
    pgadmin-data:
    redis-data:
    rabbitmq-data:
    clamav-data:
    qdrant-data:

networks:
    backend:
        driver: bridge
