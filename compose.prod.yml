services:
    api:
        image: vention-api
        restart: always
        env_file:
            - .env.production.local
        ports:
            - '3000:3000'
        depends_on:
            - db
            - redis
            - rabbitmq
        networks:
            - backend
    db:
        image: postgres:17
        container_name: postgres_db
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: app_db
        ports:
            - '5432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - backend

    pgadmin:
        image: dpage/pgadmin4
        restart: always
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@example.com
            PGADMIN_DEFAULT_PASSWORD: admin
        ports:
            - '8888:80'
        depends_on:
            - db
        volumes:
            - pgadmin-data:/var/lib/pgadmin
        networks:
            - backend
    #TODO - add auth with redis
    redis:
        image: redis:7
        restart: always
        ports:
            - '6379:6379'
        networks:
            - backend

    rabbitmq:
        image: rabbitmq:4-management
        restart: always
        ports:
            - '5672:5672'
            - '15672:15672'
        networks:
            - backend

volumes:
    postgres-data:
    pgadmin-data:

networks:
    backend:
        driver: bridge
