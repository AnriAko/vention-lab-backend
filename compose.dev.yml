services:
    db:
        image: postgres:17
        container_name: postgres_db
        restart: always
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: app_db
        ports:
            - '5432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        networks:
            - backend
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d app_db']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    pgadmin:
        image: dpage/pgadmin4
        restart: always
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@example.com
            PGADMIN_DEFAULT_PASSWORD: admin
        ports:
            - '8888:80'
        depends_on:
            db:
                condition: service_healthy
        volumes:
            - pgadmin-data:/var/lib/pgadmin
        networks:
            - backend
        healthcheck:
            test:
                ['CMD-SHELL', 'wget --spider -q http://localhost:80 || exit 1']
            interval: 30s
            timeout: 10s
            retries: 3

    redis:
        image: redis:7
        restart: always
        ports:
            - '6379:6379'
        volumes:
            - redis-data:/data
        networks:
            - backend
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

    rabbitmq:
        image: rabbitmq:4-management
        restart: always
        ports:
            - '5672:5672'
            - '15672:15672'
        volumes:
            - rabbitmq-data:/var/lib/rabbitmq
        networks:
            - backend
        healthcheck:
            test: ['CMD', 'rabbitmq-diagnostics', 'check_running']
            interval: 15s
            timeout: 10s
            retries: 5

volumes:
    postgres-data:
    pgadmin-data:
    redis-data:
    rabbitmq-data:

networks:
    backend:
        driver: bridge
